{% load static %}

<div class="card mb-3">
  <div class="card-body d-flex align-items-start gap-3">

    <div class="text-center" style="width: 60px;">
      <div class="border rounded py-2 mb-2">
        <strong style="font-size: 1.2rem;">{{ answer.rating|default:0 }}</strong><br>
        <span class="text-muted" style="font-size: 0.8rem;">votes</span>
      </div>
    </div>

    <div class="me-3">
      {% if answer.author.profile.avatar %}
        <img src="{{ answer.author.profile.avatar.url }}" 
             alt="{{ answer.author.username }}" 
             class="rounded border" 
             style="width: 80px; height: 80px; object-fit: cover;">
      {% else %}
        <img src="{% static 'img/user-avatar.jpg' %}" 
             alt="{{ answer.author.username }}" 
             class="rounded border" 
             style="width: 80px; height: 80px; object-fit: cover;">
      {% endif %}
    </div>

    <div class="flex-grow-1">
      <h5 class="card-title mb-1">{{ answer.author.username }}</h5>
      <p class="card-text mb-2">{{ answer.text }}</p>
    </div>
  </div>
</div>
