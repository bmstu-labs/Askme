{% load static %}

<div class="card mb-3 answer-card {% if answer.is_correct %}border-success border-2{% endif %}" 
     data-answer-id="{{ answer.id }}">
  <div class="card-body d-flex align-items-start gap-3">

    {% if user == question.author %}
    <button class="btn btn-sm mark-correct-btn {% if answer.is_correct %}btn-success{% else %}btn-outline-success{% endif %}"
            data-answer-id="{{ answer.id }}"
            data-question-id="{{ question.id }}">
      {% if answer.is_correct %}
        Correct
      {% else %}
        Mark correct
      {% endif %}
    </button>
    {% elif answer.is_correct %}
    <span class="badge bg-success">✓ Correct Answer</span>
    {% endif %}

    <div class="me-3">
      {% if answer.author.avatar %}
        <img src="{{ answer.author.avatar.url }}" 
             alt="{{ answer.author.username }}" 
             class="rounded border" 
             style="width: 80px; height: 80px; object-fit: cover;">
      {% else %}
        <img src="{% static 'img/user-avatar.jpg' %}" 
             alt="{{ answer.author.username }}" 
             class="rounded border" 
             style="width: 80px; height: 80px; object-fit: cover;">
      {% endif %}
    </div>

    <div class="flex-grow-1">
      <h5 class="card-title mb-1">{{ answer.author.username }}</h5>
      <p class="card-text mb-2">{{ answer.text }}</p>
    </div>
  </div>
</div>
