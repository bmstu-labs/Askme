{% load static %}

<script src="{% static 'js/voting.js' %}"></script>
<div class="card mb-3 position-relative">
  <div class="card-body d-flex align-items-start gap-3">

    <div class="position-absolute top-0 end-0 p-2 text-muted" style="font-size: 0.9rem;">
      by {{ q.author.username }}
    </div>

    <div class="text-center" style="width: 80px;">
      <button class="vote-btn" data-question-id="{{ q.id }}" data-value="1" 
              style="border: none; background: none; font-size: 20px; cursor: pointer;">▲</button>
      
      <div class="border rounded py-2 mb-2 mt-2">
        <strong style="font-size: 1.2rem;" class="vote-count">{{ q.rating|default:0 }}</strong><br>
        <span class="text-muted" style="font-size: 0.8rem;">votes</span>
      </div>
      
      <button class="vote-btn" data-question-id="{{ q.id }}" data-value="-1"
              style="border: none; background: none; font-size: 20px; cursor: pointer;">▼</button>
    </div>

    <div class="flex-grow-1">
      <h5 class="card-title mb-1">
        <a href="{% url 'question' q.id %}" class="text-decoration-none text-dark fw-semibold">
          {{ q.title }}
        </a>
      </h5>

      <p class="card-text mb-2">{{ q.text }}</p>

      <div class="d-flex flex-wrap gap-2 align-items-center">
        <span class="btn btn-outline-orange btn-sm">Answers ({{ q.answers.count }})</span>
        <div class="footer__tags">
          {% for tag in q.tags.all %}
            <a href="{% url 'tag' tag.name %}" class="text-decoration-none me-2 text-muted">
              {{ tag.name }}
            </a>
          {% endfor %}
        </div>
      </div>
    </div>

  </div>
</div>
